log_weighin:
  fields:
    weight:
      required: true
      example: 80.4
      selector:
        number:
          mode: box
          step: 0.1
    unit:
      selector:
        select:
          options:
            - kg
            - lb
          mode: dropdown
      default: kg
    date:
      selector:
        date:
    entry_id:
      selector:
        text:

trigger_test_event:
  fields:
    event_type:
      selector:
        select:
          options:
            - workout.finished
            - workout.pr
            - weighin.logged
          mode: dropdown
      default: workout.finished
    entry_id:
      selector:
        text:

get_workout_history:
  fields:
    days:
      selector:
        number:
          min: 1
          max: 365
          step: 1
          mode: slider
      default: 30
    entry_id:
      selector:
        text:

get_routines:
  fields:
    entry_id:
      selector:
        text:

