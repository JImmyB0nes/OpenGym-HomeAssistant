name: HACS-Validierung

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with HACS
        uses: ludeeus/action-hacs@main
        with:
          use_test_ha: true
        continue-on-error: true
